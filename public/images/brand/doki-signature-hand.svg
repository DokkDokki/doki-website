        fill-rule: evenodd;
        stroke: #000;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 5px;
      }

      path:nth-of-type(2) {
        animation-delay: .18s;
        animation-duration: .55s;
      }

      path:nth-of-type(3) {
