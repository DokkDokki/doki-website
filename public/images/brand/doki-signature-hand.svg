        animation-duration: .55s;
      }

      path:nth-of-type(5) {
        animation-delay: 1.12s;
        animation-duration: .34s;
      }

      @keyframes doki-draw {
        to { stroke-dashoffset: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cls-1 {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
